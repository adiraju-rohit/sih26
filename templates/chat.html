<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  /* ---------- Light mode: white + pastel green (matches the light logo) ---------- */
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --bubble-assistant:#edf8f1;
    --border:#dcebe0;
    --text:#1f2a24;
    --muted:#6b7b71;
    --accent:#2f8a4e;
    --accent-hover:#256e3e;
    --accent-contrast:#ffffff;
    --accent-soft:#e3f3e8;
    --error:#dc2626;
    --rec:#ef4444;
    --shadow:0 2px 16px rgba(31,42,36,0.06);
  }
  /* ---------- Dark mode: dark grey + white (matches the dark logo) ---------- */
  :root[data-theme="dark"]{
    --bg:#2b2d30;
    --surface:#343638;
    --bubble-assistant:#3b3e41;
    --border:#47494c;
    --text:#f3f3f3;
    --muted:#a7abae;
    --accent:#ffffff;
    --accent-hover:#e4e4e4;
    --accent-contrast:#2b2d30;
    --accent-soft:#44474a;
    --error:#f87171;
    --rec:#f87171;
    --shadow:0 2px 16px rgba(0,0,0,0.3);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#2b2d30;
      --surface:#343638;
      --bubble-assistant:#3b3e41;
      --border:#47494c;
      --text:#f3f3f3;
      --muted:#a7abae;
      --accent:#ffffff;
      --accent-hover:#e4e4e4;
      --accent-contrast:#2b2d30;
      --accent-soft:#44474a;
      --error:#f87171;
      --rec:#f87171;
      --shadow:0 2px 16px rgba(0,0,0,0.3);
    }
  }

  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 18px;
    background:var(--surface);
    box-shadow:var(--shadow);
    position:relative;
    z-index:2;
    flex-shrink:0;
    gap:10px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; }
  .brand img{ height:34px; width:auto; display:block; }
  .logo-dark{ display:none; }
  :root[data-theme="dark"] .logo-light{ display:none; }
  :root[data-theme="dark"] .logo-dark{ display:block; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .logo-light{ display:none; }
    :root:not([data-theme="light"]) .logo-dark{ display:block; }
  }

  .header-actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .icon-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:34px;
    height:34px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--accent-soft); color:var(--text); }
  .icon-btn svg{ width:18px; height:18px; }
  .icon-sun{ display:none; }
  :root[data-theme="dark"] .icon-moon{ display:none; }
  :root[data-theme="dark"] .icon-sun{ display:block; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .icon-moon{ display:none; }
    :root:not([data-theme="light"]) .icon-sun{ display:block; }
  }

  .pill-btn{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    font:inherit;
    font-size:0.76rem;
    font-weight:600;
    padding:7px 13px;
    border-radius:999px;
    cursor:pointer;
    white-space:nowrap;
  }
  .pill-btn:hover{ border-color:var(--accent); color:var(--text); }
  #answerModeBtn.mode-document{
    border-color:var(--accent);
    color:var(--accent-contrast);
    background:var(--accent);
  }
  :root[data-theme="dark"] #answerModeBtn.mode-document{ color:var(--accent-contrast); }

  /* ---------- messages ---------- */
  main{
    flex:1;
    overflow-y:auto;
    padding:20px 14px 10px;
    scrollbar-width:thin;
    scrollbar-color:var(--border) transparent;
  }
  main::-webkit-scrollbar{ width:6px; }
  main::-webkit-scrollbar-thumb{ background:var(--border); border-radius:3px; }

  .msg-row{ display:flex; margin-bottom:14px; animation:rise .18s ease-out; }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }
  .msg-row.user{ justify-content:flex-end; }
  .bubble{
    max-width:78%;
    padding:12px 16px;
    border-radius:16px;
    font-size:0.96rem;
    line-height:1.5;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.user .bubble{
    background:var(--accent);
    color:var(--accent-contrast);
    border-bottom-right-radius:5px;
  }
  .msg-row.assistant .bubble{
    background:var(--bubble-assistant);
    color:var(--text);
    border-bottom-left-radius:5px;
    display:flex;
    align-items:flex-start;
    gap:10px;
  }
  .bubble-text{ flex:1; }
  .replay-btn{
    flex-shrink:0;
    width:26px;
    height:26px;
    margin-top:1px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .replay-btn:hover{ background:var(--accent-soft); color:var(--accent-hover); }
  .replay-btn svg{ width:13px; height:13px; }

  .empty-state{
    text-align:center;
    color:var(--muted);
    font-size:0.92rem;
    margin-top:60px;
    padding:0 24px;
    line-height:1.6;
  }

  /* ---------- controls ---------- */
  .controls{
    flex-shrink:0;
    background:var(--surface);
    box-shadow:0 -2px 16px rgba(31,42,36,0.05);
    padding:12px 16px;
    position:relative;
    z-index:2;
  }
  .status-line{
    text-align:center;
    font-size:0.8rem;
    color:var(--muted);
    min-height:18px;
    margin-bottom:8px;
  }
  .status-line.recording{ color:var(--rec); font-weight:600; }
  .status-line.error{ color:var(--error); }

  .mic-row{ display:flex; align-items:center; justify-content:center; }
  #micBtn{
    width:58px;
    height:58px;
    border-radius:50%;
    border:none;
    background:var(--accent);
    color:var(--accent-contrast);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 12px rgba(0,0,0,0.15);
    transition:transform .12s ease, background .15s ease;
    user-select:none;
    touch-action:none;
    flex-shrink:0;
  }
  #micBtn svg{ width:22px; height:22px; }
  #micBtn.active{
    background:var(--rec);
    color:#fff;
    transform:scale(1.1);
    animation:pulse 1.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(239,68,68,0.45); }
    100%{ box-shadow:0 0 0 16px rgba(239,68,68,0); }
  }

  .text-row{ display:flex; gap:8px; margin-top:12px; }
  .text-row input{
    flex:1;
    min-width:0;
    padding:11px 15px;
    font:inherit;
    font-size:0.95rem;
    border:1px solid var(--border);
    border-radius:999px;
    outline:none;
    background:var(--bg);
    color:var(--text);
  }
  .text-row input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .text-row button{
    width:42px;
    height:42px;
    flex-shrink:0;
    padding:0;
    background:var(--accent);
    color:var(--accent-contrast);
    border:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .text-row button:hover{ background:var(--accent-hover); }
  .text-row button svg{ width:17px; height:17px; }

  @media (max-width:480px){
    header{ padding:9px 14px; }
    .brand img{ height:28px; }
    .bubble{ max-width:88%; font-size:0.92rem; }
    #micBtn{ width:54px; height:54px; }
    .pill-btn{ font-size:0.7rem; padding:6px 11px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <img class="logo-light" src="{{ url_for('static', filename='light.png') }}" alt="Arya">
      <img class="logo-dark" src="{{ url_for('static', filename='dark.png') }}" alt="Arya">
    </div>
    <div class="header-actions">
      <button id="answerModeBtn" class="pill-btn" type="button" title="Toggle between web search and the local knowledge document">Web search</button>
      <button id="clearBtn" class="icon-btn" type="button" aria-label="Clear chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path><path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </button>
      <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>
          <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>
          <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>
        </svg>
      </button>
    </div>
  </header>

  <main id="chatMain">
    {% if not messages %}
    <div class="empty-state" id="emptyState">
      Hold the mic or press S to speak. English and Indian languages supported.
    </div>
    {% endif %}
    {% for m in messages %}
      <div class="msg-row {{ 'user' if m.role == 'user' else 'assistant' }}">
        <div class="bubble">{{ m.text }}</div>
      </div>
    {% endfor %}
  </main>

  <div class="controls">
    <div class="status-line" id="statusLine">Hold to speak</div>
    <div class="mic-row">
      <button id="micBtn" type="button" aria-label="Hold to speak">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
    </div>

    <form class="text-row" id="textForm">
      <input type="text" id="textInput" placeholder="Type a message" autocomplete="off">
      <button type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>
</div>

<script>
const chatMain      = document.getElementById('chatMain');
const emptyState    = document.getElementById('emptyState');
const micBtn        = document.getElementById('micBtn');
const statusLine    = document.getElementById('statusLine');
const textForm      = document.getElementById('textForm');
const textInput     = document.getElementById('textInput');
const clearBtn      = document.getElementById('clearBtn');
const answerModeBtn = document.getElementById('answerModeBtn');
const themeToggle   = document.getElementById('themeToggle');

/* ---------------- dark mode ---------------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
}
applyTheme(localStorage.getItem('theme') ||
  (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeToggle.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
});

function addBubble(role, text, lang, audioUrl) {
  if (emptyState) emptyState.remove();
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.dataset.lang = lang || 'en-IN';
  if (lang) bubble.lang = lang;
  bubble.dataset.audioUrl = audioUrl || '';

  const textEl = document.createElement('div');
  textEl.className = 'bubble-text';
  textEl.appendChild(document.createTextNode(text));
  bubble.appendChild(textEl);

  if (role === 'assistant' && text) {
    const replayBtn = document.createElement('button');
    replayBtn.type = 'button';
    replayBtn.className = 'replay-btn';
    replayBtn.setAttribute('aria-label', 'Play this answer aloud');
    replayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20 6 4"></polygon></svg>';
    // Manual fallback: also covers browsers (notably iOS Safari) that
    // only allow audio playback triggered directly inside a user-gesture
    // handler.
    replayBtn.addEventListener('click', () => playAnswer(bubble.dataset.audioUrl, text, bubble.dataset.lang));
    bubble.appendChild(replayBtn);
  }
  row.appendChild(bubble);
  chatMain.appendChild(row);
  chatMain.scrollTop = chatMain.scrollHeight;
  return bubble;
}

function setStatus(text, kind) {
  statusLine.textContent = text;
  statusLine.className = 'status-line' + (kind ? ' ' + kind : '');
}

// Chrome/Edge/Firefox load the voice list asynchronously; calling
// speakBrowser() before it's ready can silently produce no audio on the
// very first try.
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// Last-resort fallback ONLY: reads text with whatever voice the browser
// has installed for `lang`. Most browsers/OSes don't ship an installed
// voice for languages like Telugu, Tamil, Bengali, etc. and silently
// substitute a default voice (usually English) instead of actually
// failing - so this only gets used when the server couldn't produce real
// audio in the correct language (see playAnswer() below), which is by
// far the more reliable path.
function speakBrowser(text, lang) {
  if (!('speechSynthesis' in window) || !text) {
    if (!('speechSynthesis' in window)) {
      setStatus('This browser cannot speak answers aloud - use the play button instead.', 'error');
    }
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang || 'en-IN';
  utter.onerror = () => setStatus('Could not play audio - try the play button on the answer.', 'error');
  window.speechSynthesis.speak(utter);
}

// Plays the server-generated audio (real Bhashini/espeak-ng/Groq TTS audio,
// actually spoken in the input language) when available; only falls back
// to the browser's own speechSynthesis if the server couldn't produce
// audio at all (e.g. no TTS backend configured).
function playAnswer(audioUrl, text, lang) {
  if (!audioUrl) {
    speakBrowser(text, lang);
    return;
  }
  const audio = new Audio(audioUrl);
  audio.play().catch(() => {
    // Autoplay blocked by the browser, or the file failed to load -
    // fall back so the person still hears *something*.
    speakBrowser(text, lang);
  });
}

/* ---------------- text fallback ---------------- */
textForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  addBubble('user', text);
  setStatus('Thinking...');
  try {
    const res = await fetch('/api/text_message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text })
    });
    const data = await res.json();
    if (data.ok) {
      addBubble('assistant', data.answer, data.speech_lang, data.audio_url);
      // Plays immediately - triggered right here, in the same handler
      // that sent the question, so no separate tap is needed.
      playAnswer(data.audio_url, data.answer, data.speech_lang);
      setStatus('Hold to speak');
    } else {
      setStatus(data.error || 'Something went wrong.', 'error');
    }
  } catch (err) {
    setStatus('Network error. Please try again.', 'error');
  }
});

/* ---------------- clear ---------------- */
clearBtn.addEventListener('click', async () => {
  await fetch('/api/clear', { method: 'POST' });
  window.location.reload();
});

/* ---------------- answer mode toggle (web search vs local document) ---- */
function renderAnswerMode(mode) {
  const isDocument = mode === 'document';
  answerModeBtn.textContent = isDocument ? 'Knowledge doc' : 'Web search';
  answerModeBtn.classList.toggle('mode-document', isDocument);
  answerModeBtn.dataset.mode = mode;
}

async function loadAnswerMode() {
  try {
    const res = await fetch('/api/settings/answer_mode');
    const data = await res.json();
    if (data.ok) renderAnswerMode(data.mode);
  } catch (err) { /* keep default label */ }
}
loadAnswerMode();

answerModeBtn.addEventListener('click', async () => {
  const nextMode = answerModeBtn.dataset.mode === 'document' ? 'web' : 'document';
  answerModeBtn.disabled = true;
  try {
    const res = await fetch('/api/settings/answer_mode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mode: nextMode }),
    });
    const data = await res.json();
    if (data.ok) renderAnswerMode(data.mode);
  } catch (err) { /* ignore */ }
  finally { answerModeBtn.disabled = false; }
});

/* ---------------- push-to-talk voice recording ---------------- */
let mediaRecorder = null;
let audioChunks = [];
let recording = false;
let stream = null;

async function startRecording() {
  if (recording) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus('Microphone is not supported on this device.', 'error');
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    setStatus('Microphone permission was denied.', 'error');
    return;
  }
  audioChunks = [];
  const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
  mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = onRecordingStop;
  mediaRecorder.start();
  recording = true;
  micBtn.classList.add('active');
  setStatus('Listening...', 'recording');
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  micBtn.classList.remove('active');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
}

/* Bhashini's speech recognition can't read the browser's WebM/Opus
   recordings, so convert the clip to 16 kHz mono 16-bit WAV right here. */
async function blobToWav16k(blob) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx();
  let decoded;
  try {
    decoded = await ctx.decodeAudioData(await blob.arrayBuffer());
  } finally {
    if (ctx.close) ctx.close();
  }
  const rate = 16000;
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * rate)), rate);
  const src = off.createBufferSource();
  src.buffer = decoded;
  src.connect(off.destination);
  src.start();
  const samples = (await off.startRendering()).getChannelData(0);

  const buf = new ArrayBuffer(44 + samples.length * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); str(8, 'WAVE');
  str(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

async function onRecordingStop() {
  if (!audioChunks.length) {
    setStatus('Hold to speak');
    return;
  }
  const blob = new Blob(audioChunks, { type: audioChunks[0].type || 'audio/webm' });
  audioChunks = [];

  if (blob.size < 800) {
    setStatus('Recording was too short. Try again.', 'error');
    return;
  }

  setStatus('Processing...');
  const formData = new FormData();
  let uploadBlob = blob, uploadName = 'speech.webm';
  try {
    uploadBlob = await blobToWav16k(blob);
    uploadName = 'speech.wav';
  } catch (e) {
    console.warn('WAV conversion failed, uploading original recording:', e);
  }
  formData.append('audio', uploadBlob, uploadName);

  try {
    const res = await fetch('/api/voice_message', { method: 'POST', body: formData });
    const data = await res.json();
    if (data.ok) {
      addBubble('user', data.user_text, data.speech_lang);
      addBubble('assistant', data.answer, data.speech_lang, data.audio_url);
      // Immediate playback - no extra tap required. Uses the real
      // server-generated audio (in the input language) when available,
      // so a Telugu question gets an actual Telugu voice back instead of
      // silently falling back to whatever default voice the browser has.
      playAnswer(data.audio_url, data.answer, data.speech_lang);
      setStatus('Hold to speak');
    } else {
      setStatus(data.error || 'Could not process the recording.', 'error');
    }
  } catch (err) {
    setStatus('Network error. Please try again.', 'error');
  }
}

/* mouse / touch on the mic button */
micBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startRecording(); });
micBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); }, { passive: false });
['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach(evt => {
  micBtn.addEventListener(evt, (e) => { e.preventDefault(); stopRecording(); });
});

/* hold the S key */
let sKeyDown = false;
window.addEventListener('keydown', (e) => {
  if ((e.key === 's' || e.key === 'S') && !sKeyDown && document.activeElement !== textInput) {
    sKeyDown = true;
    startRecording();
  }
});
window.addEventListener('keyup', (e) => {
  if (e.key === 's' || e.key === 'S') {
    sKeyDown = false;
    stopRecording();
  }
});

chatMain.scrollTop = chatMain.scrollHeight;
</script>
</body>
</html>
